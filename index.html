<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerte Sécurité</title>
    <link rel="stylesheet" href="style.css">

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background-image: url("https://www.logodesignlove.com/wp-content/uploads/2012/08/microsoft-logo-01.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .popup-overlay {
            min-height: 100vh;
            background: transparent;
        }
    </style>
</head>
<body>
    <div class="popup-overlay">
        <div class="popup-content">


            <div class="popup-message">
                <h1>⚠️ ALERTE</h1>

                <div class="alert-text">
                    ⚠️ ALERTE code 2227# ? Vous êtes en présence d'un malveillant !
                    N'éteignez surtout pas votre appareil et veuillez contacter l'assistance en ligne.
                </div>

                <a href="tel:099...520." class="btn-support">
                    Contacter l'assistance : 099...520.
                </a>

                <button class="close-btn" onclick="closePopup()">×</button>
            </div>

            <div class="trojan-top-container">
                <div class="trojan-scroll"></div>
                <div class="trojan-scroll-top"></div>
            </div>

            <div class="trojan-scroll-bottom"></div>
        </div>
    </div>

    <audio id="voice-alert" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
